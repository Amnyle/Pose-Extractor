[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-extractor"
version = "0.1.0"
description = "Extract one photo per distinct pose held in a bodybuilding video"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python>=4.8",
    "mediapipe>=0.10.14",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pose-extractor = "pose_extractor.cli:main"

[tool.setuptools]
packages = ["pose_extractor"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
