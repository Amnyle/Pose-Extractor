# Build the Android app (mobile/, wrapping app/) and publish the APK as the "android-latest" release:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/Poses.apk
#
# Signing: with the POSES_KEYSTORE_BASE64, POSES_KEYSTORE_PASSWORD, POSES_KEY_ALIAS and
# POSES_KEY_PASSWORD secrets set, the APK is signed with that key and installs as an update of the
# previous one. Without them it is signed with a throw-away debug key: it installs, but the previous
# version must be uninstalled first. See mobile/README.md.
name: Android app

on:
  push:
    branches: [main]
    paths: ["app/**", "mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test the app logic
        run: node --test app/tests/*.test.mjs

      - name: Web app with MediaPipe and the pose model
        run: app/scripts/fetch-vendor.sh

      - name: Copy the web app into the Android project
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
          rm -rf android/app/src/main/assets/public/tests android/app/src/main/assets/public/scripts

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.POSES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/poses.keystore"
            echo "keystore=$RUNNER_TEMP/poses.keystore" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "signed=your key" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "signed=a debug key (uninstall the previous version before installing)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        working-directory: mobile/android
        env:
          POSES_KEYSTORE: ${{ steps.key.outputs.keystore }}
          POSES_KEYSTORE_PASSWORD: ${{ secrets.POSES_KEYSTORE_PASSWORD }}
          POSES_KEY_ALIAS: ${{ secrets.POSES_KEY_ALIAS }}
          POSES_KEY_PASSWORD: ${{ secrets.POSES_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon ${{ steps.key.outputs.task }}
          cp ${{ steps.key.outputs.apk }} "$RUNNER_TEMP/Poses.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Poses-apk
          path: ${{ runner.temp }}/Poses.apk

      - name: Publish as the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create android-latest "$RUNNER_TEMP/Poses.apk" \
            --target "$GITHUB_SHA" \
            --title "Android app $APP_VERSION_NAME" \
            --notes "Open this page on your Android phone and tap **Poses.apk** to install. Built from ${GITHUB_SHA::7}, signed with ${{ steps.key.outputs.signed }}."
